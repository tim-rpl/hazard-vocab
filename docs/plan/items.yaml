    size: "M"
    notes: "Blocks **nothing in this unit**; blocks the first profile, which is a later unit \u2014 see PA8"
    in_unit: "excused"
    excused_because: "serves the first profile, a later unit"
    latency: "short"
  P5:
    item: "`vocab/prefixes.yaml`, the bound **identities** in ADR-004's generated worklist, external graphs cached"
    produces: "the binding surface \u2014 **external identity only** (PA25)"
    blocks_start: "P20"
    blocks_trust: "\u2014"
    done_when: "`prefixes.yaml` resolves every prefix used; **every external term in ADR-004's generated worklist** is content-verified by fetch-and-grep; external graphs are cached locally. **The local slots are NOT declared here** \u2014 clause 3 removed, see PA25. **Restated by P20, 2026-08-05.** This read *23 external terms* and *the ten local terms*, the population ADR-004 retires as unrecoverable. The worklist is the replacement and **no count is stated here** \u2014 a new total would be one more figure agreeing with an earlier one by accident. **Clauses 2 and 3 are discharged** (see notes); what this criterion still asks for is clause 1"
    size: "S"
    notes: "Blocks P6a, P7, P10. **Clauses 2 and 3 are discharged, 2026-08-04**, by `vocab/external/`: 21 graphs cached, every bound term content-verified by fetch-and-grep, and each term's definition read out of the cached graph — `vocab/external/manifest.md`, `vocab/external/bound-terms.md`. **What remains of P5 is clause 1, `vocab/prefixes.yaml`, which does not exist.** **Size restated `L` → `S` by P20, 2026-08-05, and it is a measurement rather than a re-estimate:** two of three clauses are discharged artifacts on disk, so the remaining work is one file. **P5 is no longer the long pole**; PA5, PA17 and PA28's sizing claims are restated in the same pass"
    in_unit: "required"
    latency: "short"
  P6a:
    item: "Part 0 entity + alias core \u2014 the ADR-001 question-1 shape"
    produces: "`vocab/core/part0-*.yaml`"
    blocks_start: "P5, P17"
    blocks_trust: "P10"
    done_when: "**P17 answers PA29 and PA30's decisions first** (a blocks-start edge, not a sentence \u2014 BV12). Then: `build/shapes.ttl` carries an `sh:path` for **`id`, `identifierValue`, `identifierScheme`, `issuingAuthority`, `elevation`, `sourceVerificationTier`** and for **`prov:generatedAtTime`** — *not* `assertedTime` (I2), and for `crs` or PA29's substitute (**PA28**); `operatingMode`, `modelVersion`, `profileConformance` likewise (PG5); **for each slot named above, cardinality and range are identical under both ADR-003 options**; `make gen` runs to completion, which requires `vocab/core/vocabulary.yaml` (PG11); the core validates under `make lint` (P16 is **done**, BV13); `flat-siblings.yaml` still passes. **A bound slot is asserted by its URI, not by its local name.** This criterion named `assertedTime`; ADR-004 Decision C gives it `slot_uri: prov:generatedAtTime`, and `gen-shacl` (linkml 1.11.1) then emits `sh:path prov:generatedAtTime` with the string `assertedTime` appearing **0 times** in the output — re-run by H 2026-08-04, exit 0. **The criterion was satisfiable only by omitting the `slot_uri`, i.e. by violating the ADR it implements.** The same correction applies to any future name in this list that acquires a `slot_uri`"
    size: "M"
    notes: "Settled by ADR-001 Q1. Does **not** wait on P2. P17 carries PA29/PA30's preconditions, now an edge (BV12)"
    in_unit: "required"
    latency: "short"
