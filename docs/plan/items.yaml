    size: "S"
    notes: "Completion needs an **O session** \u2014 only O changes a claim's status. External dependency, not a work item"
    in_unit: "excused"
    excused_because: "completion needs an O session; the claim change is O's"
    latency: "long"
    latency_because: "an O session"
  P2:
    item: "Decide ADR-001 question 2"
    produces: "design gate; A/B/C chosen or explicitly deferred"
    blocks_start: "P1"
    blocks_trust: "\u2014"
