# Plan 01 items — the single source for every view in the plan document.
#
# Five hand-maintained lists keyed by item id caused BV9, BV17, BV21 and
# BV24. This replaces all of them. `derive-waves.py` generates the item
# table, the wave view, the definition-of-done table, the latency ranking
# and the in-unit membership lists into the document; `--check` fails if
# any block is stale. Edit here, never in the document.
