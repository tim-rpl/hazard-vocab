    size: "S"
    notes: "Blocks **P6b only**, not P6a \u2014 see PA11"
    in_unit: "excused"
    excused_because: "decided at the design gate 2026-08-02 (ADR-001)"
    latency: "long"
    latency_because: "a design-gate decision"
