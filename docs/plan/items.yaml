  P22:
    item: "Retarget Part 2 to earthquake — C2's own cheapest test, on a throwaway schema"
    produces: "a scratch Part 2 for USGS ComCat/ShakeMap, and a `git diff --stat` against the wildfire Part 2"
    blocks_start: "P7"
    blocks_trust: "—"
    done_when: "A scratch Part 2 validates ≥1 real USGS ComCat capture, and **`git diff --stat` between it and P7's Part 2 is reported whatever it shows**. C2's falsifier is *structural change to Parts 2, 3, 5 or 6*, so the result is read against that and **not** against the *touching Parts 4 and 7 lightly* half, which C2's own evidence records as unfalsifiable. Two outcomes are both success for this item: no structural change, or a named one. **A pass that reports no diff without running `make check` against a real capture is not a result** — C2's suspected counterexample is that the ShakeMap area is *modelled*, and under ADR-003 option B that lands on `epistemicKind`, which only an instance exercises"
    size: "S"
    notes: "**C2's cheapest test, and C2 is the claim the whole project rests on.** Its own entry names it: *write Parts 2, 3 and 6 for earthquake; do not use flood — too similar to wildfire.* **Part 2 is this unit**, so the test is available now at one feed and a throwaway schema. **Nothing lands in `vocab/core/`** — this item authors no canonical content and is deleted after it reports. Earthquake is the case C2 flags against itself: the event is point-like and instantaneous and its extent is a ShakeMap, which is **modelled**, so the Part 1 / Part 3 boundary may sit elsewhere than wildfire puts it. **If it fails, that is worth knowing before Part 1's ARC rather than during it.** Only Part 2 is retargeted here; Parts 3 and 6 are later units, so this is a partial run of C2's test and says so"
    in_unit: "required"
    latency: "short"
  P20:
    item: "Restate P5 and the four prose passages over ADR-004's generated worklist"
    produces: "a plan of record whose live sites name the enumerated list, not a retired count"
    blocks_start: "—"
    blocks_trust: "—"
    done_when: "**MET 2026-08-05.** Census re-derived at **24 live sites**, not the 12 carried in notes — third growth, which is why clause 1 forbids carrying it. All restated over ADR-004's generated worklist with no count stated; P5 size `L` \u2192 `S` on measurement. Guard in `derive-waves.py`, wired into `make lint`, **probed 12/12 reintroductions caught and 3/3 retractions survive**. Original criterion: **Re-derive the census first; do not carry the one in `notes`.** A 2026-08-03 census bounded a 2026-08-04 criterion and two live sites fell outside it (BV7-4) — one because an em-dash defeats the enumeration's pattern, one because its hit was filtered as noise. The census is a measurement with a date, not a definition. Then: every censused site names **ADR-004's generated worklist** and states no count — P5's item and `done_when`, and **the plan's copies** of PA5, PA19, T4 and T4a. The register copies at `claims.md` are **out of scope**: restating a register claim is a proposal H makes and O disposes, and T4a's Evidence already carries the note. **The guard is derived, not remembered:** re-run `grep -ohE '(23|ten|10) [a-z]+( [a-z]+)?' docs/plan/ -r | sort | uniq -c | sort -rn` **before writing it**, and build the pattern from what it returns. As of 2026-08-04 that is six phrasings for `23` — `bind`, `binding`, `bindings`, `external terms`, `external identities`, `external bindings` — plus `(ten|10) local( terms)?` and `10 write of`. **Verified by putting each measured phrasing back one at a time and watching the guard fail**, not by observing that the guard exists. Quoted (`*\"…\"*`) and blockquoted (`>`) text is exempt, as in `derive-surface.py`, and **the exemption is probed against a retraction before shipping** — historical sites stay: the closed measure document, quoted originals, amendment records. `derive-waves.py --check` and `derive-surface.py --check` both pass"
    size: "S"
    notes: "**Subject widened 2026-08-05: retired figures AND sizing claims about items.** The census pattern matches numerals; *P5 is the long pole* is a sizing claim and no pattern reaches it. It is the same shape as PA5's dependency sentence, which went false when P20 became P5's predecessor and needed its own amendment — prose against the graph, in the document whose generator exists for that class. Assuming the census reached it is what left three residues standing after the sweep run to find them. **Repair, not discovery.** The criterion-4 retired-figure sweep is a gate duty and is deliberately NOT an item — a gate duty in the item graph makes the graph model the process rather than the work. **The census in this field is HISTORY, not the bound. `done_when` carries the live one.** Corrected 2026-08-05 (F4): this read *twelve live sites* and *all twelve are marked and none corrected* while `done_when` read **24** and *all restated* \u2014 a stale census in `notes` bounding a later criterion is BV7-4, which is the reason clause 1 exists, restated inside the item that carries clause 1. **No work was missed; the contradiction was.** History, in order: 8 censused 2026-08-03; 10 after BV7-4's two (PA25's *'PA19 was right about the 23'* and PA25's `assertedTime` paragraph, whose `the 23 \u2014` an em-dash hides from a noun-anchored pattern); 12 after H widened its own checker to anchor on the determiner; **24 when clause 1 forced a re-derivation** \u2014 the jump came from making the exemption file-aware, since `items.yaml`'s values are all double-quoted scalars. **Sizing-site pointers deleted rather than updated**: `plan:381`, `:624`, `:966` were wrong when written and a line number in a prose field goes stale on the next edit. **The second of those two also asserted a decided question was open** — ADR-004 Decision C — and that half is withdrawn in place rather than deferred, because a stale figure misleads about a quantity while a stale open-question misleads about what is settled. **The first version of this criterion named four literal strings, covered three phrasings, and could not see PA19's `23 external identities` or T4's `23 external bindings` — two of its own eight sites (BV6-1).** A criterion satisfiable without doing the thing it exists for; eighth instance of *the subject is narrower than the claim*, inside the definition of done written to close the seventh. `23 bind / 10 write of 33` is the figure ADR-004 retires as unrecoverable. **No new total** — that would be a sixth figure agreeing with a fifth by accident"
    in_unit: "required"
    latency: "short"
  P19:
    item: "Cross-slot constraint generator"
    produces: "SHACL `sh:equals` and kin emitted from LinkML `annotations:`, after `gen-shacl`"
    blocks_start: "\u2014"
    blocks_trust: "\u2014"
    done_when: "`exp-01`'s case A raises a violation under `make check`, and the `sosa:observedProperty` case from A34 does too \u2014 both from `annotations:` in the source, with nothing hand-written under `build/`"
    size: "M"
    notes: "ADR-005. **C5's affirmative evidence depends on this, and it is outside plan 01's scope statement** \u2014 recorded rather than smoothed over"
    in_unit: "excused"
    excused_because: "ADR-005's implementation; not required by plan 01's scope statement, and C5 stays `asserted` until it exists"
    latency: "short"
  P21:
    item: "Clear the design-gate rationale residues, in one pass"
    produces: "`docs/residuals-01-design-gate.md` with every entry moved to Cleared"
    blocks_start: "—"
    blocks_trust: "—"
    done_when: "Every entry in `docs/residuals-01-design-gate.md` is under **Cleared** with the repair named and the marker removed, and each cleared entry's own falsifier has been **run** and returns nothing. Then: the ADR states its ground in one section and references it elsewhere, per `ADR-template.md`. **Verified by the paraphrase sweep, not a string sweep** — restate each withdrawn claim without reusing its wording and grep the content words that survive, which is the instrument that would have caught R1 and the one a string sweep cannot be"
    size: "S"
    notes: "**`FALSIFIER.md` §3.1.** A rationale defect inside a decided ADR records; a decision defect blocks. Eight gate rounds produced eight partial passes, and a partial retraction is worse than none — withdrawn at one site, standing at another, the document disagreeing with itself. Same repair shape as **P20**: one pass over a written list. **A marker is not a repair** — marked sites tell a reader the passage is stale and name the owner; restating them is this item's work"
    in_unit: "required"
    latency: "short"
